<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1D2E"/>
      <stop offset="100%" stop-color="#102A42"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="8" y="8" width="1264" height="384" rx="14"/>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="1264" height="384" rx="14" fill="url(#sky)" stroke="#1B3A5C" stroke-width="2"/>

  <g clip-path="url(#win)">
    <!-- horizon glow -->
    <rect x="8" y="250" width="1264" height="142" fill="#12314C" opacity="0.55"/>

    <!-- Castello Aragonese, real photo, duotone and faded into the window -->
    <image href="castle.png" x="520" y="20" width="760" height="372" opacity="0.85" preserveAspectRatio="xMidYMid slice"/>

    <!-- title bar -->
    <rect x="8" y="8" width="1264" height="46" fill="#16324D"/>
    <line x1="8" y1="54" x2="1272" y2="54" stroke="#1B3A5C" stroke-width="2"/>
    <circle cx="40" cy="31" r="7" fill="#FF5F56"/>
    <circle cx="64" cy="31" r="7" fill="#FFBD2E"/>
    <circle cx="88" cy="31" r="7" fill="#27C93F"/>
    <text x="640" y="37" font-size="17" fill="#7E9AB5" text-anchor="middle">riccardo@radlab: ~</text>

    <!-- terminal session -->
    <g font-size="20">
      <text x="40" y="102">
        <tspan fill="#E8862A">riccardo@radlab</tspan><tspan fill="#7E9AB5">:</tspan><tspan fill="#6CB8B3">~</tspan><tspan fill="#7E9AB5">$ </tspan><tspan fill="#F7F3EE">whoami</tspan>
      </text>
      <text x="40" y="132" fill="#87A878">Riccardo M'rad, founder of RAD LAB</text>

      <text x="40" y="176">
        <tspan fill="#E8862A">riccardo@radlab</tspan><tspan fill="#7E9AB5">:</tspan><tspan fill="#6CB8B3">~</tspan><tspan fill="#7E9AB5">$ </tspan><tspan fill="#F7F3EE">cat what-i-do.txt</tspan>
      </text>
      <text x="40" y="206" fill="#87A878">I automate local businesses in Italy: WhatsApp bookings,</text>
      <text x="40" y="234" fill="#87A878">reminders, review follow-ups. n8n + Claude Code.</text>

      <text x="40" y="278">
        <tspan fill="#E8862A">riccardo@radlab</tspan><tspan fill="#7E9AB5">:</tspan><tspan fill="#6CB8B3">~</tspan><tspan fill="#7E9AB5">$ </tspan><tspan fill="#F7F3EE">ls shipped/</tspan>
      </text>
      <text x="40" y="308" fill="#87A878">menulampo/   n8n-templates/   claude-skills/</text>

      <text x="40" y="352">
        <tspan fill="#E8862A">riccardo@radlab</tspan><tspan fill="#7E9AB5">:</tspan><tspan fill="#6CB8B3">~</tspan><tspan fill="#7E9AB5">$ </tspan><tspan fill="#F7F3EE">_</tspan>
      </text>
    </g>

    <!-- made in Italy -->
    <g transform="translate(1060, 336)">
      <rect x="0" y="0" width="14" height="26" fill="#008C45"/>
      <rect x="14" y="0" width="14" height="26" fill="#F4F5F0"/>
      <rect x="28" y="0" width="14" height="26" fill="#CD212A"/>
      <rect x="0" y="0" width="42" height="26" fill="none" stroke="#1B3A5C" stroke-width="1"/>
      <text x="54" y="19" font-size="17" fill="#7E9AB5">Made in Italy</text>
    </g>
  </g>
</svg>
